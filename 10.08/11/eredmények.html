<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">

    <title>Eredmények</title>

<body>

<table>

    <tr>
        <td rowspan="11">
            <img src="kepek/hatterbal.jpg" alt="bal háttér" class="bal">

    </tr>

    </tr>

        <td colspan="3">
            <img src="kepek/dij1.jpg" alt="első helyezett" class="belseje">
        </td>

        <td>Alkotás neve: Jupiter</td>

    </tr>

        <td colspan="3" class="kiemelt">3. díj</td>
    </tr>

    <tr>
        <td colspan="3">
            <img src="kepek/dij3.jpg" alt="harmadik helyezett" class="belseje">

        <td>Alkotás neve: Gyümölcsbomba</td>
        <td>Elkészítési idő: 8 perc</td>
        <td>Alkotó neve: Kleininger Adél</td>
    </tr>

</html>
